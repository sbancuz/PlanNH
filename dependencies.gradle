/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    api("com.github.GTNewHorizons:NotEnoughItems:2.8.137-GTNH:dev")
    api("com.github.GTNewHorizons:GTNHLib:0.11.48:dev")
    api("com.github.GTNewHorizons:ModularUI2:2.3.89-1.7.10:dev")
    api("com.github.GTNewHorizons:waila:1.19.34:dev")

    implementation(files("libs/offscreen-0.2-alpha-dev.jar"))

    compileOnly("com.github.GTNewHorizons:EnderIO:2.10.45:dev")
    compileOnly("com.github.GTNewHorizons:Botania:1.13.36-GTNH:dev")
    compileOnly(rfg.deobf("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev"))
    compileOnly("com.github.GTNewHorizons:AspectRecipeIndex:1.1.5:dev")
    compileOnly("com.github.GTNewHorizons:LogisticsPipes:1.5.36-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:Random-Things:2.7.9:dev")
    compileOnly("com.github.GTNewHorizons:ThaumicTinkerer:2.12.32:dev")
    compileOnly("com.github.GTNewHorizons:WitchingGadgets:1.8.51-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:Thaumic_Exploration:1.5.28-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:Avaritia:1.99:dev")
    compileOnly("com.github.GTNewHorizons:Binnie:2.6.48:dev")
    compileOnly("com.github.GTNewHorizons:BloodMagic:1.9.13:dev")
    compileOnly("com.github.GTNewHorizons:Galacticraft:3.4.34-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:gendustry:1.9.13-GTNH:dev")
    compileOnly("net.glease:tc4recipelib:1.5.37:dev")
    compileOnly("com.github.GTNewHorizons:ForestryMC:4.11.37:dev")
    compileOnly("ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.45-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:NEI-Integration:1.5.3:dev")
    compileOnly("com.github.GTNewHorizons:Draconic-Evolution:1.5.33-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:harvestcraft:1.3.15-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:Gadomancy:1.5.15:dev")
    compileOnly("com.github.GTNewHorizons:ProjectBlue:1.2.10-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:TinkersConstruct:1.14.111-GTNH:dev")
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.149:dev")
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.149:dev")
    compileOnly("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-999-GTNH:dev")
    runtimeOnlyNonPublishable('com.github.GTNewHorizons:Angelica:2.2.13:dev') { transitive = false }

    // runtimeOnlyNonPublishable('net.neoforged:render-nurse:0.0.14')

    // Speeds up mod identification and loading in dev
    runtimeOnlyNonPublishable(rfg.deobf("com.github.GTNewHorizons:CoreTweaks:0.3.4.7-GTNH"))

    // @Data annotation for the data class, see: [https://projectlombok.org/api/lombok/Data]
    compileOnly('org.projectlombok:lombok:1.18.46')
    annotationProcessor('org.projectlombok:lombok:1.18.46')

    // ILP solver
    shadowImplementation('org.ojalgo:ojalgo:57.1.0')

    // Opt-in GTNH pack recipes for the dev client: `./gradlew runClient -PgtnhRecipes`.
    // Loads the GTNH coremod (dreamcraft) so NEI shows the pack's recipe tweaks in dev.
    if (project.hasProperty('gtnhRecipes')) {
        runtimeOnlyNonPublishable('com.github.GTNewHorizons:NewHorizonsCoreMod:2.9.62:dev')
    }

    // Auto-layout engine. 0.8.x is the last Java 8 compatible ELK release line.
    shadowImplementation('org.eclipse.elk:org.eclipse.elk.alg.layered:0.8.1') {
        // XMI is EMF's file serialization; PlanNH only builds ELK graphs programmatically.
        exclude group: 'org.eclipse.emf', module: 'org.eclipse.emf.ecore.xmi'
    }

    // Headless test harness (corpus charts are gtnh-flow style YAML)
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.10.2')
    testImplementation('org.yaml:snakeyaml:2.2')
}
